<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COA Builder</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <button type="button" class="panel-toggle" aria-controls="coa-panel" aria-expanded="true">COAs</button>
      <h1 class="app-title">COA Builder</h1>
      <span class="storage-status" data-storage-status role="status"></span>
      <button type="button" class="panel-toggle" aria-controls="editor-panel" aria-expanded="true">Units</button>
    </header>
    <main class="app-main">
      <aside id="coa-panel" class="panel panel-coa" aria-label="Courses of action" data-open="true">
        <h2 class="panel-title">Courses of action</h2>
        <div data-region="coa-list"></div>
      </aside>
      <div id="map" class="map" role="region" aria-label="Map"></div>
      <aside id="editor-panel" class="panel panel-editor" aria-label="Symbol editor" data-open="true">
        <h2 class="panel-title">Units</h2>
        <div data-region="symbol-editor"></div>
      </aside>
    </main>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/milsymbol/milsymbol.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
