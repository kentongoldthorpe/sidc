<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>COA Builder</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <button type="button" class="panel-toggle" aria-controls="side-panel" aria-expanded="true">Tools</button>
      <h1 class="app-title">COA Builder</h1>
      <span class="project-badge" data-project-name title="The open project"></span>
      <div class="segmented workspace-switch" role="radiogroup" aria-label="Workspace" data-workspace-switch>
        <label><input type="radio" name="workspace" value="map" checked><span>Map</span></label>
        <label><input type="radio" name="workspace" value="threat"><span>Threat models</span></label>
      </div>
      <span class="storage-status" data-storage-status role="status"></span>
      <div class="header-history" data-region="history" data-workspace="map"></div>
    </header>
    <main class="app-main">
      <aside id="side-panel" class="panel" aria-label="Tools" data-open="true">
        <section class="panel-section" data-section="project" data-open="false">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="false" aria-controls="section-project">
              <span class="section-name">Project</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-project" class="section-body" data-region="projects"></div>
        </section>
        <section class="panel-section" data-section="coas" data-workspace="map" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-coas">
              <span class="section-name">COAs</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-coas" class="section-body" data-region="coa-list"></div>
        </section>
        <section class="panel-section" data-section="units" data-workspace="map" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-units">
              <span class="section-name">Units</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-units" class="section-body" data-region="symbol-editor"></div>
        </section>
        <section class="panel-section" data-section="graphics" data-workspace="map" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-graphics">
              <span class="section-name">Lines &amp; areas</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-graphics" class="section-body" data-region="graphics"></div>
        </section>
        <section class="panel-section" data-section="map" data-workspace="map" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-map">
              <span class="section-name">Map</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-map" class="section-body" data-region="map-layers"></div>
        </section>
        <section class="panel-section" data-section="export" data-workspace="map" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-export">
              <span class="section-name">Export</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-export" class="section-body" data-region="export"></div>
        </section>
        <section class="panel-section" data-section="threat-models" data-workspace="threat" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-threat-models">
              <span class="section-name">Threat models</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-threat-models" class="section-body" data-region="threat-models"></div>
        </section>
        <section class="panel-section" data-section="threat-coas" data-workspace="threat" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-threat-coas">
              <span class="section-name">Threat COAs</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-threat-coas" class="section-body" data-region="threat-coas"></div>
        </section>
        <section class="panel-section" data-section="template" data-workspace="threat" data-open="true">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-template">
              <span class="section-name">Template</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-template" class="section-body" data-region="template-editor"></div>
        </section>
        <section class="panel-section" data-section="systems" data-workspace="threat" data-open="false">
          <h2 class="section-heading">
            <button type="button" class="section-toggle" aria-expanded="false" aria-controls="section-systems">
              <span class="section-name">Systems</span><span class="section-summary" data-summary></span>
            </button>
          </h2>
          <div id="section-systems" class="section-body" data-region="systems"></div>
        </section>
      </aside>
      <div id="map" class="map" role="region" aria-label="Map" data-workspace="map"></div>
      <div id="template-canvas" class="map template-canvas" role="region" aria-label="Threat template canvas (metres, no terrain)" data-workspace="threat"></div>
    </main>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/milsymbol/milsymbol.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
